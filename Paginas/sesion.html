<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
</head>
<body>
    <div>
       <form id="formulario" method="post">
        <label>Ingrese su identificacion</label>
        <input type="text" placeholder="Ingrese su identificacion" id="identificacion" name="identificacion">
        <br>
        <label>Ingrese su nombre de usuario</label>
        <input type="text" placeholder="Ingrese su nombre" id="nombre" name="nombre">
        <br>
        <label>Ingrese su apellido de usuario</label>
        <input type="text" placeholder="Ingrese su apellido" id="apellido" name="apellido">
        <br>
        <label> ingrese correo electronico</label>
        <input type="email" placeholder="example@gmail.com" id="correo" name="correo">
        <br>
        <label>Ingrese su numero de contacto</label>
        <input type="text" placeholder="09xxxxxxx" id="contacto" name="contacto">
        <br>
        <input type="submit" name="enviar">
        </form> 
    </div>
    
<script src="../assets/js/app.js"></script>
</body>
</html>
